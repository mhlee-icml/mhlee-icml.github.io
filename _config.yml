title: ICML Lab
description: Intelligent Control & Machine Learning Lab, Incheon National University.
url: https://mhlee-icml.github.io
baseurl: ""
lang: en
locale: en-US
timezone: Asia/Seoul
encoding: utf-8
markdown: kramdown
highlighter: rouge
strict_front_matter: true
include:
  - _pages
exclude:
  - content
  - scripts
  - README.md
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - vendor
  - .tools
  - .cache
  - .bundle
  - .venv
  - build.ps1
  - preview.ps1
  - requirements.txt
defaults:
  - scope:
      path: ""
    values:
      layout: page
