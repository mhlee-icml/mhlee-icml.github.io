name: Build and deploy ICML site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Ruby and install dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up Node.js for carousel checks
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate pages from preserved content
        run: python scripts/prepare.py

      - name: Check carousel behavior
        run: node scripts/test_carousel.mjs

      - name: Build the site
        run: bundle exec jekyll build --baseurl "$PAGES_BASE_PATH"
        env:
          JEKYLL_ENV: production
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Validate content, images, and internal links
        run: python scripts/validate.py --require-build

      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
